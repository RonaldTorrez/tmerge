name: Publish NPM

on:
  push:
    branches:
      - master
  workflow_run:
    workflows: [ "Tests" ]
    types:
      - completed

jobs:
  prepare:
    runs-on: [ self-hosted, ubuntu-latest ]
    outputs:
      publish: ${{ steps.check_version.outputs.publish }}
    steps:
      - name: Checkout
        uses: ./.github/actions/checkout

      - name: Get previous commit SHA
        id: prev_commit
        run: echo "commit_sha=$(git rev-parse HEAD^1)" >> $GITHUB_OUTPUT

      - name: Check if version changed
        id: check_version
        run: |
          old_version=$(git show ${{ steps.prev_commit.outputs.commit_sha }}:package.json | jq -r .version)
          new_version=$(jq -r .version package.json)

          echo "Old version: $old_version"
          echo "New version: $new_version"

          if [ "$old_version" != "$new_version" ]; then
            echo "Version changed"
            echo "publish=true" >> $GITHUB_OUTPUT
          else
            echo "No version change"
            echo "publish=false" >> $GITHUB_OUTPUT
        env:
          CI: true

  publish:
    needs: [ prepare ]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: ./.github/actions/checkout

      - name: Setup Node
        uses: ./.github/actions/node-pnpm
        with:
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install

      - name: Publish to NPM
        run: pnpm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
