name: Tests

on:
  push:
    branches:
      - '**'

jobs:
  test:
    runs-on: [ self-hosted, ubuntu-latest ]
    steps:
      - name: Checkout
        uses: ./.github/actions/checkout

      - name: Setup Node
        uses: ./.github/actions/node-pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
