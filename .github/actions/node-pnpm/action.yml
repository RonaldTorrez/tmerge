name: Node and PNPM
description: Wrapper for Node and PNPM

inputs:
  registry-url:
    required: false
    default: ""
    description: NPM registry URL

runs:
  using: "composite"
  steps:
    - name: Install pnpm
      id: pnpm
      uses: pnpm/action-setup@v4
      with:
        run_install: |
          - args: [--frozen-lockfile, --strict-peer-dependencies]

    - name: Install Node.js
      id: setup-node
      uses: actions/setup-node@v4
      with:
        registry-url: ${{ inputs.registry-url }}
        node-version: 22
        cache: "pnpm"

    - name: Install dependencies
      run: pnpm install
      shell: bash
